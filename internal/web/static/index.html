<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>deckk</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <h1 class="visually-hidden">deckk</h1>
  <header class="toolbar">
    <div class="toolbar-inner">
      <div class="brand">
        <img src="icon.svg" alt="" width="27" height="18">
        <span>deckk</span>
      </div>
      <p class="tallies" id="tallies"></p>
      <p class="live" id="live" data-state="connecting" aria-live="polite">Connecting</p>
    </div>
  </header>

  <main class="layout">
    <div class="primary">
      <div id="clashes"></div>
      <section class="next" id="next" aria-labelledby="next-title"></section>
      <section class="sessions" aria-labelledby="sessions-title">
        <div class="section-head">
          <h2 id="sessions-title">Sessions</h2>
          <div id="grouping"></div>
        </div>
        <div id="groups"></div>
      </section>
    </div>
    <aside class="secondary">
      <section class="panel" id="today" aria-labelledby="today-title"></section>
      <section class="panel" id="goals" aria-labelledby="goals-title"></section>
      <section class="panel" id="activity" aria-labelledby="activity-title"></section>
    </aside>
  </main>

  <p class="toast" id="toast" role="status" aria-live="polite"></p>
  <script src="app.js"></script>
</body>
</html>
