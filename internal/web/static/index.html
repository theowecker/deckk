<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>deckk</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <nav class="sidebar" aria-label="deckk">
      <div class="brand">
        <svg class="cassette" viewBox="0 0 30 20" aria-hidden="true">
          <rect class="shell" x="2" y="0" width="26" height="1"/>
          <rect class="shell" x="0" y="1" width="30" height="16"/>
          <rect class="label" x="4" y="3" width="22" height="3"/>
          <rect class="window" x="4" y="6" width="22" height="6"/>
          <rect class="tape" x="12" y="9" width="6" height="1"/>
          <g transform="translate(9 9)"><g class="reel"><circle r="2.2"/><path d="M0 -2.2 A2.2 2.2 0 0 1 0 2.2 Z"/></g></g>
          <g transform="translate(21 9)"><g class="reel"><circle r="2.2"/><path d="M0 -2.2 A2.2 2.2 0 0 1 0 2.2 Z"/></g></g>
          <rect class="base" x="6" y="14" width="18" height="3"/>
          <rect class="base" x="2" y="17" width="26" height="3"/>
        </svg>
        <span>deckk</span>
      </div>
      <ul class="nav">
        <li><a href="#home" data-section="home"><span class="icon icon-home" aria-hidden="true"></span>Home<span class="count" id="count-home"></span></a></li>
        <li><a href="#sessions" data-section="sessions"><span class="icon icon-sessions" aria-hidden="true"></span>Sessions<span class="count" id="count-sessions"></span></a></li>
        <li><a href="#deckk" data-section="deckk"><span class="icon icon-deckk" aria-hidden="true"></span>deckk<span class="count" id="count-deckk"></span></a></li>
      </ul>
      <p class="live" id="live" data-state="connecting" aria-live="polite">Connecting</p>
    </nav>

    <main class="content">
      <p class="offline" id="offline" role="status" hidden></p>
      <section class="page" id="page-home" aria-labelledby="home-title" hidden>
        <header class="page-head">
          <h1 id="home-title">Home</h1>
          <p class="subtitle" id="home-subtitle"></p>
        </header>
        <div class="columns">
          <div class="main-column">
            <div id="clashes"></div>
            <section aria-labelledby="next-title">
              <h2 id="next-title">Next up</h2>
              <p class="lede">What deckk suggests.</p>
              <div id="next"></div>
            </section>
            <section aria-labelledby="look-title" id="look-section" hidden>
              <h2 id="look-title">Needs a look</h2>
              <p class="lede">What reviews flagged in sessions' latest work.</p>
              <div id="look"></div>
            </section>
            <section aria-labelledby="now-title">
              <h2 id="now-title">Right now</h2>
              <div id="now"></div>
            </section>
          </div>
          <aside class="side-column">
            <section class="panel" id="today" aria-label="Today"></section>
            <section class="panel" id="activity" aria-label="Activity"></section>
          </aside>
        </div>
      </section>

      <section class="page" id="page-sessions" aria-labelledby="sessions-title" hidden>
        <header class="page-head">
          <h1 id="sessions-title">Sessions</h1>
          <div class="toolbar-row">
            <label class="search">
              <span class="visually-hidden">Search every session</span>
              <input id="search" type="search" placeholder="Search every session" autocomplete="off" spellcheck="false">
            </label>
            <div id="grouping"></div>
            <button class="button primary" id="new-button" type="button" data-focus="new-button" aria-controls="new-session" aria-expanded="false">New session</button>
          </div>
        </header>
        <section class="panel new-session" id="new-session" aria-label="New session" hidden></section>
        <div id="groups"></div>
      </section>

      <section class="page" id="page-deckk" aria-labelledby="deckk-title" hidden>
        <header class="page-head">
          <h1 id="deckk-title">deckk</h1>
          <p class="subtitle">The Claude that keeps your sessions and goals organized.</p>
        </header>
        <div class="columns">
          <div class="main-column">
            <div class="chat-card" id="chat"></div>
          </div>
          <aside class="side-column">
            <section class="panel" id="goals" aria-label="Goals"></section>
          </aside>
        </div>
      </section>
    </main>
  </div>

  <p class="toast" id="toast" role="status" aria-live="polite"></p>
  <script src="app.js"></script>
</body>
</html>
