version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/deckk
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
      - amd64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"

homebrew_casks:
  - name: deckk
    repository:
      owner: theowecker
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/theowecker/deckk
    description: One tab to find, switch between and resume your Claude Code sessions
    license: MIT
    dependencies:
      - formula: tmux
      - formula: terminal-notifier
    hooks:
      post:
        # The binary is unsigned, so Gatekeeper would refuse to run it.
        install_steps: |
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/deckk"]
